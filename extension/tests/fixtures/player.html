<div id="movie_player" class="html5-video-player ad-showing">
  <div class="html5-video-container"><video></video></div>
  <div class="ytp-chrome-top">
    <button class="ytp-button" aria-label="Watch later">Watch later</button>
    <button class="ytp-button" aria-label="Share">Share</button>
  </div>
  <div class="video-ads ytp-ad-module">
    <span class="ytp-ad-badge">Sponsored</span>
    <button class="ytp-ad-button" id="button:7" aria-label="My Ad Center"></button>
    <div class="ytp-ad-skip-button-container"></div>
  </div>
  <div class="ytp-chrome-bottom">
    <div class="ytp-left-controls">
      <button class="ytp-play-button ytp-button" aria-label="Pause (k)" title="Pause (k)"></button>
      <button class="ytp-mute-button ytp-button" aria-label="Mute (m)" title="Mute (m)"></button>
    </div>
    <div class="ytp-right-controls">
      <button class="ytp-subtitles-button ytp-button" aria-label="Subtitles/closed captions unavailable" aria-pressed="false"></button>
      <button class="ytp-settings-button ytp-button" aria-label="Settings" aria-haspopup="true"></button>
      <button class="ytp-fullscreen-button ytp-button" aria-label="Full screen (f)" title="Full screen (f)"></button>
    </div>
  </div>
</div>
<div id="autoplay">
  <button aria-label="Cancel" data-size="0">Cancel</button>
  <button aria-label="Cancel" data-size="0">Cancel</button>
</div>
