<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JEV-AD-Blocker Options</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #111; }
      fieldset { margin: 16px 0; border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px; }
      label { display: block; margin: 8px 0 4px; }
      input[type="text"], input[type="url"], input[type="password"], select { width: 100%; box-sizing: border-box; padding: 6px; }
      .inline { display: flex; align-items: center; gap: 8px; }
      .inline label { margin: 0; }
      [hidden] { display: none !important; }
      #status { min-height: 1.5em; margin-top: 8px; }
      #logs { font-size: 13px; padding-left: 18px; }
      #logs li { margin: 4px 0; word-break: break-word; }
    </style>
  </head>
  <body>
    <h1>JEV-AD-Blocker</h1>

    <fieldset>
      <legend>Settings</legend>
      <div class="inline">
        <input type="checkbox" id="enabled" />
        <label for="enabled">Enable the ad blocker</label>
      </div>

      <label for="provider">Provider</label>
      <select id="provider">
        <option value="">Choose a provider</option>
        <option value="nano">nano (on-device, experimental)</option>
        <option value="openai">openai (OpenAI-compatible endpoint)</option>
        <option value="jev">jev (not implemented yet)</option>
      </select>

      <div id="openai-fields" hidden>
        <label for="baseUrl">Base URL (for example https://api.example.com/v1)</label>
        <input type="url" id="baseUrl" autocomplete="off" />
        <label for="model">Model name</label>
        <input type="text" id="model" autocomplete="off" />
      </div>

      <div id="key-field" hidden>
        <label for="key">API key</label>
        <input type="password" id="key" autocomplete="off" />
      </div>

      <p><button type="button" id="save">Save</button></p>
      <div id="status" role="status"></div>
    </fieldset>

    <fieldset>
      <legend>Last flow logs (newest first, up to 20)</legend>
      <ul id="logs"></ul>
    </fieldset>

    <script type="module" src="options.js"></script>
  </body>
</html>
